{# What his wardrobe costs at one price level. Sent again with every change, like the summary bar. While his
   wardrobe is empty there is no figure: "0 €" would read as a price. #}
<small id="level-{{ key }}"{% if oob %} hx-swap-oob="true"{% endif %}>{% if w.slots %}{{ w.levels[key]|eur }}{% endif %}</small>
