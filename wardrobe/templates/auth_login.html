{% extends "_public.html" %}
{% block title %}Log in · Capsule{% endblock %}
{% block head %}
  <meta name="robots" content="noindex">
{% endblock %}
{% block main %}
<section class="card auth">
  <h1>Log in</h1>
  <form class="form" method="post" action="{{ url_for('auth.login') }}">{{ csrf_field() }}
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label class="field"><span>Email</span>
      <input type="email" name="email" autocomplete="username" required value="{{ email or '' }}"></label>
    <label class="field"><span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn">Log in</button>
  </form>
  <p class="muted small"><a href="{{ url_for('auth.forgot') }}">Forgot your password?</a> · New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</section>
{% endblock %}
