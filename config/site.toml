# ══════════════════════════════════════════════════════════════════════════════
#  Visitors without an account ("guests")
#
#  guests = true    Anyone can open Outfits without an account and look through
#                   one example wardrobe, the same for every visitor: its
#                   outfits, each piece's name and colour, and an AI picture
#                   where one has been drawn already. The stores, prices, sizes
#                   and links are left out of those pages, and every button
#                   that would change or save something (Add to my wardrobe,
#                   Not for me, a swap, a new picture, the budget) leads to
#                   "Create your account" instead. Nothing a visitor does is
#                   stored. Those outfits are then the home page, "/"; the
#                   website's own words are at /about.
#  guests = false   Outfits needs an account again, and "/" is the landing
#                   page, as before.
#
#  Edits to `guests` apply on the next page load. Only the public site
#  (production) has guests: on your own machine there is no login, and nothing
#  changes. The site's own lock (SITE_PASSWORD, or Cloudflare Access) still
#  comes first.
# ══════════════════════════════════════════════════════════════════════════════

guests = true

# The budget the visitors' example wardrobe is planned for, in €: everyday and
# the office, fitted to it at "Best for budget" (visitors never see its prices).
# It is the example's own: a new account still starts at 300 € (Basic).
# Changing it replans the example at the next start of the server, so its
# outfits change: their AI pictures must then be drawn again
# (python -m wardrobe example-pictures), as the old ones show other outfits.
# (An outfit of the very same products as one drawn before keeps its picture.)
example_budget = 600
