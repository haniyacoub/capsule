# ══════════════════════════════════════════════════════════════════════════════
#  Where the collector looks, and how gently
#
#  `python -m wardrobe refresh` opens one ordinary Chrome window and, for each
#  slot, visits only the category pages listed here for that garment type —
#  never search pages, never whole catalogues. It reads each store's robots.txt
#  first and skips anything that file disallows. The first "Access Denied" or
#  captcha from a store ends that store's run; nothing is retried or disguised.
#  `refresh --pool` reads the same category pages for the shared list, and
#  `refresh --pool --fabric` each collected product's own page, once, only for
#  its fabric (agreed by the owner on 22 Nov 2026; see product_pages below).
#
#  Category addresses change when a store reorganises its menu. If a page comes
#  back "not found", open the store, copy the new address into the list below.
#
#  Which stores customers are offered: every store below has a `programme` line,
#  the network that runs its partner (affiliate) programme, or "none". Only
#  stores with a programme are ever shown to customers or collected; a store
#  with "none" is skipped everywhere, also where its products are still in a
#  file (wardrobe/programmes.py). Networks: awin, rakuten, tradedoubler,
#  partnerize, daisycon, webgains, impact.
#
#  What a store is like: `styles` (the styles of config/style.toml it sells) and
#  `price` (budget, mid, premium, or two of them: a tee under about 20 EUR is
#  budget, 20 to 60 EUR mid, above that premium). A customer's style brief
#  ranks the stores by them (wardrobe/style.py). From research/round6/stores.md
#  where that covers the store.
# ══════════════════════════════════════════════════════════════════════════════

[collector]
browser            = "chrome"   # "chrome" = your installed Google Chrome; "chromium" = Playwright's own
headless           = false      # the stores refuse headless browsers outright, so keep the window
pause_seconds      = [5, 9]     # wait a random time in this range between two page loads
max_candidates     = 6          # per slot, per store
max_listing_pages  = 3          # pages of a category to read ("?page=2", …) before giving up
pool_listing_pages = 2          # the same for `refresh --pool`, which reads every garment's pages: about an hour for 8 stores

# The fabric pass (`refresh --pool --fabric`, wardrobe/collect/fabric.py): each
# collected product's own page, read once, only for its fabric, through the same
# window and pauses. It costs time: about 9 seconds a page with the pause, so
# 300 pages are about 45 minutes a store, and the first batch's 3,000 or so
# products about 7 to 8 hours in all, over several runs: each run reads at most
# max_product_pages a store and the next carries on where it stopped. A store
# whose product pages are refused to automated browsers says
# `product_pages = false` in its own table and is never asked; false here
# switches the pass off altogether.
product_pages      = true
max_product_pages  = 300
max_pages_per_store = 160       # hard ceiling on page loads per store in one run
page_timeout_seconds = 45

# Plain capsule pieces only: names containing these words are skipped unless
# the slot's own keywords ask for them.
skip_words = [
  "gestreift", "streifen", "striped", "stripe", "kariert", "karo", "check", "print", "bedruckt",
  "jacquard", "muster", "camouflage", "grafik", "graphic", "logo", "stickerei", "embroider",
  "batik", "tie-dye", "kontrast", "contrast", "farbblock", "color block", "colour block", "colorblock",
  "colourblock", "camo",
  "mehrfarbig", "bunt", "schriftzug", "slogan", "cropped", "pack", "set ", "houndstooth", "hahnentritt", "paisley",
]
# `refresh --pool` only (it keeps every product of a category page): these are
# left out too, as clothes for sport or underneath, and lines named for their
# logo. Not read by the per-piece refresh or when products are matched.
pool_skip_words = [
  "drymove", "thermomove", "training", "sportshirt", "sport-t-shirt", "sportjacke", "sporthose",
  "basketball", "trikot", "unterzieh", "undershirt", "unterhemd", "script", "gfx",
  "dri-fit", "therma-fit", "running", "track jacket", "trackjacket", "track pant", "trackpant",
  "nba", "disney", "subaru",                                                     # licensed prints
]

# Slot keywords are written in English; product names are mostly German.
[collector.keyword_words]
wool        = ["woll", "wool"]
merino      = ["merino"]
cashmere    = ["kaschmir", "cashmere"]
cotton      = ["baumwoll", "cotton"]
linen       = ["leinen", "linen"]
leather     = ["leder", "leather"]
suede       = ["veloursleder", "wildleder", "suede"]
oxford      = ["oxford"]
poplin      = ["popeline", "poplin"]
flannel     = ["flanell", "flannel"]
heavyweight = ["schwer", "heavy"]
lightweight = ["leicht", "light"]
knitted     = ["strick", "knit"]
crew-neck   = ["rundhals", "crew"]
tailored    = ["anzug", "tailored", "bundfalte", "formell", "smart"]
straight    = ["gerade", "straight"]
slim        = ["schmal", "slim"]
relaxed     = ["relax", "locker", "lässig"]
derby       = ["derby"]
loafer      = ["loafer", "mokassin", "slipper"]
chelsea     = ["chelsea"]
harrington  = ["harrington"]
bomber      = ["bomber"]
# The streetwear pieces' words (added 19 Nov 2026): a boxy tee, loose jeans, chunky sneakers, a parka.
boxy        = ["boxy", "kastig"]
