# ══════════════════════════════════════════════════════════════════════════════
#  Where the collector looks, and how gently
#
#  `python -m wardrobe refresh` opens one ordinary Chrome window and, for each
#  slot, visits only the category pages listed here for that garment type —
#  never search pages, never whole catalogues. It reads each store's robots.txt
#  first and skips anything that file disallows. The first "Access Denied" or
#  captcha from a store ends that store's run; nothing is retried or disguised.
#
#  Category addresses change when a store reorganises its menu. If a page comes
#  back "not found", open the store, copy the new address into the list below.
#
#  Which stores customers are offered: every store below has a `programme` line,
#  the network that runs its partner (affiliate) programme, or "none". Only
#  stores with a programme are ever shown to customers or collected; a store
#  with "none" is skipped everywhere, also where its products are still in a
#  file (wardrobe/programmes.py). Networks: awin, rakuten, tradedoubler,
#  partnerize, daisycon, webgains, impact.
# ══════════════════════════════════════════════════════════════════════════════

[collector]
browser            = "chrome"   # "chrome" = your installed Google Chrome; "chromium" = Playwright's own
headless           = false      # the stores refuse headless browsers outright, so keep the window
pause_seconds      = [5, 9]     # wait a random time in this range between two page loads
max_candidates     = 6          # per slot, per store
max_listing_pages  = 3          # pages of a category to read ("?page=2", …) before giving up
max_pages_per_store = 160       # hard ceiling on page loads per store in one run
page_timeout_seconds = 45

# Plain capsule pieces only: names containing these words are skipped unless
# the slot's own keywords ask for them.
skip_words = [
  "gestreift", "streifen", "striped", "stripe", "kariert", "karo", "check", "print", "bedruckt",
  "jacquard", "muster", "camouflage", "grafik", "graphic", "logo", "stickerei", "embroider",
  "batik", "tie-dye", "kontrast", "contrast", "farbblock", "color block", "colour block",
  "mehrfarbig", "bunt", "schriftzug", "slogan", "cropped", "pack", "set ",
]

# Slot keywords are written in English; product names are mostly German.
[collector.keyword_words]
wool        = ["woll", "wool"]
merino      = ["merino"]
cashmere    = ["kaschmir", "cashmere"]
cotton      = ["baumwoll", "cotton"]
linen       = ["leinen", "linen"]
leather     = ["leder", "leather"]
suede       = ["veloursleder", "wildleder", "suede"]
oxford      = ["oxford"]
poplin      = ["popeline", "poplin"]
flannel     = ["flanell", "flannel"]
heavyweight = ["schwer", "heavy"]
lightweight = ["leicht", "light"]
knitted     = ["strick", "knit"]
crew-neck   = ["rundhals", "crew"]
tailored    = ["anzug", "tailored", "bundfalte", "formell", "smart"]
straight    = ["gerade", "straight"]
slim        = ["schmal", "slim"]
relaxed     = ["relax", "locker", "lässig"]
derby       = ["derby"]
loafer      = ["loafer", "mokassin", "slipper"]
chelsea     = ["chelsea"]
harrington  = ["harrington"]
bomber      = ["bomber"]


# ── COS ───────────────────────────────────────────────────────────────────────
# Category pages give name, price, colour, picture and link. COS answers
# "Access Denied" to automated browsers on product pages, so those are not
# visited: fabric is estimated from the product name and size stock is unknown
# until you add it by hand (slot page → "Add details").
[cos]
label         = "COS"
programme     = "rakuten"      # Germany is listed; it recruits "content creators", which may not cover a styling site (PLAN.md, medium confidence)
base          = "https://www.cos.com"

[cos.garments.coat]
pages   = ["/de-de/men/coats-and-jackets/wool-coats", "/de-de/men/coats-and-jackets"]
include = ["mantel", "coat"]
exclude = ["weste", "gilet", "jacke", "leder", "wattiert", "stepp", "daunen", "puffer"]

[cos.garments.jacket]
pages   = ["/de-de/men/coats-and-jackets"]
include = ["jacke", "jacket", "blouson", "bomber"]
exclude = ["mantel", "coat", "weste", "gilet", "leder", "steppjacke", "wattiert", "daunen", "puffer", "hemdjacke", "overshirt", "strickjacke"]

[cos.garments.blazer]
pages   = ["/de-de/men/suits"]
include = ["blazer", "sakko"]
exclude = ["smoking", "samt", "tuxedo"]

[cos.garments.overshirt]
pages   = ["/de-de/men/shirts", "/de-de/men/coats-and-jackets"]
include = ["overshirt", "hemdjacke"]
exclude = ["leder"]

[cos.garments.cardigan]
pages   = ["/de-de/men/knitwear/cardigans"]
exclude = ["weste", "pullunder"]

[cos.garments.knit]
pages   = ["/de-de/men/knitwear/jumper"]
exclude = ["cardigan", "polo", "hoodie", "kapuze", "weste", "pullunder", "sweatshirt", "reißverschluss", "zip"]

[cos.garments.shirt]
pages   = ["/de-de/men/shirts"]
exclude = ["overshirt", "hemdjacke", "kurzarm", "short-sleeve", "polo", "t-shirt"]

[cos.garments.polo]
pages   = ["/de-de/men/polo-shirts"]

[cos.garments.tee]
pages   = ["/de-de/men/t-shirts"]
exclude = ["langarm", "long-sleeve", "tank", "ärmellos", "polo", "henley"]

[cos.garments.longsleeve]
pages   = ["/de-de/men/t-shirts"]
include = ["langarm", "long-sleeve"]
exclude = ["polo", "henley"]

[cos.garments.trousers]
pages   = ["/de-de/men/trousers"]
exclude = ["chino", "jeans", "jogg", "shorts", "cargo", "leder", "sweat"]

[cos.garments.chinos]
pages   = ["/de-de/men/trousers"]
include = ["chino"]

[cos.garments.jeans]
pages   = ["/de-de/men/jeans"]
exclude = ["shorts", "jacke", "hemd"]

[cos.garments.sneakers]
pages   = ["/de-de/men/shoes"]
include = ["sneaker", "trainer"]

[cos.garments.shoes]
pages   = ["/de-de/men/shoes/loafers", "/de-de/men/shoes"]
include = ["loafer", "derby", "schnürschuh", "lace-up", "mokassin"]
exclude = ["sneaker", "boot", "stiefel", "sandal"]

[cos.garments.boots]
pages   = ["/de-de/men/shoes/boots"]


# ── Weekday ───────────────────────────────────────────────────────────────────
# Category pages give name, price, colour, picture, link and size stock.
# Product pages are refused to automated browsers (as at COS), so fabric is
# estimated from the name. Weekday sells no men's shoes.
[weekday]
label         = "Weekday"
# Rakuten, but UNCONFIRMED for Germany: Rakuten lists Weekday for Great Britain only, and its
# Nordic programme (Adtraction) does not cover Germany. Kept on offer until the application
# says otherwise; set "none" if Weekday has no programme open to a German site.
programme     = "rakuten"
base          = "https://www.weekday.com"

[weekday.garments.coat]
pages   = ["/de-de/men/jackets-and-coats/"]
include = ["mantel", "coat"]
exclude = ["leder", "wattiert", "stepp", "daunen", "puffer"]

[weekday.garments.jacket]
pages   = ["/de-de/men/jackets-and-coats/"]
exclude = ["mantel", "coat", "weste", "vest", "blazer", "puffer", "daunen", "stepp", "leder", "fleece"]

[weekday.garments.blazer]
pages   = ["/de-de/men/jackets-and-coats/"]
include = ["blazer", "sakko"]

[weekday.garments.overshirt]
pages   = ["/de-de/men/shirts/"]
include = ["overshirt", "hemdjacke"]
exclude = ["leder"]

[weekday.garments.cardigan]
pages   = ["/de-de/men/knitwear/cardigans/"]

[weekday.garments.knit]
pages   = ["/de-de/men/knitwear/sweaters/"]
exclude = ["cardigan", "strickjacke", "hoodie", "weste", "zip", "reißverschluss", "polo"]

[weekday.garments.shirt]
pages   = ["/de-de/men/shirts/"]
exclude = ["overshirt", "hemdjacke", "kurzarm", "short-sleeve", "kurzärm"]

[weekday.garments.polo]
pages   = ["/de-de/men/t-shirts-and-tops/"]
include = ["polo"]

[weekday.garments.tee]
pages   = ["/de-de/men/t-shirts-and-tops/"]
include = ["t-shirt"]
exclude = ["langarm", "long-sleeve", "longsleeve", "tank", "polo", "ärmellos"]

[weekday.garments.longsleeve]
pages   = ["/de-de/men/t-shirts-and-tops/"]
include = ["langarm", "long-sleeve", "longsleeve"]
exclude = ["polo"]

[weekday.garments.trousers]
pages   = ["/de-de/men/trousers/"]
exclude = ["jogg", "sweat", "cargo", "chino", "shorts", "track", "jeans", "leder", "5-pocket", "denim", "bootcut"]

[weekday.garments.chinos]
pages   = ["/de-de/men/trousers/"]
include = ["chino"]

[weekday.garments.jeans]
pages   = ["/de-de/men/jeans/"]
exclude = ["shorts", "jacke", "jorts"]


# ── Zara ──────────────────────────────────────────────────────────────────────
# No partner programme open to a site like this (only an invite-style creator
# scheme), so Zara is never offered to customers and never collected. Its
# products in older files are skipped as they are read.
[zara]
label         = "Zara"
programme     = "none"
