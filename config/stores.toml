# ── Which garment a product is, for the shared list (refresh --pool) ──────────
# `python -m wardrobe refresh --pool` keeps every plain product of a store's
# category pages and sorts each into ONE garment type, by the page it came
# from and its name (collect/pool.py). Where a store lists one page for
# several garment types (trousers, chinos and cargo trousers often share one),
# these words decide: a product counts as a garment when its name holds one of
# the `include` words (if there are any) and none of the `exclude` words. A
# product that fits no garment of its page, or two, is left out and counted in
# the run's report. A store's own [<store>.garments.<garment>] include/exclude
# replace these for that store. Words are matched inside the name, ignoring
# case: "chino" finds "Chinohose". A space before a word means it must start a
# word (" t-shirt" is not the end of "Draft-Shirt"), a space after it that it
# must end one ("coat " is not "Coating"); a hyphen, a slash and the start or
# end of the name count as edges too. `page_decides = true`: on a page listed for
# that garment alone, its include words are not needed (a long-sleeve page's
# "T-Shirt 4711" is a long-sleeve tee); hoodies and blazers keep needing theirs,
# as their pages also show sweatshirts and suit trousers.
[collector.garment_rules.tee]
exclude = ["langarm", "long sleeve", "long-sleeve", "longsleeve", "l/s ", "tank", "ärmellos", "polo", "henley",
           "unterhemd", "pyjama", "schlaf", " vest"]
[collector.garment_rules.longsleeve]
include = ["langarm", "long sleeve", "long-sleeve", "longsleeve", "l/s "]
page_decides = true
exclude = ["polo", "henley", "hemd", "pyjama", "schlaf"]
[collector.garment_rules.polo]
include = ["polo"]
page_decides = true
[collector.garment_rules.shirt]
exclude = ["overshirt", "hemdjacke", "shacket", "shirt jac", "kurzarm", "short sleeve", "short-sleeve", " s/s ",
           "polo", " t-shirt", "tshirt", "jacke", "jacket", "weste", "pyjama"]
[collector.garment_rules.overshirt]
include = ["overshirt", "hemdjacke", "hemd-jacke", "shacket", "shirt jac", "shirt-jac"]
page_decides = true
exclude = ["leder"]
[collector.garment_rules.knit]
exclude = ["cardigan", "strickjacke", "polo", "hoodie", "kapuze", "weste", "pullunder", "sweatshirt", "sweat-shirt",
           "reißverschluss", "zip", "troyer", "jacke", "sakko", "blazer", " vest"]
[collector.garment_rules.cardigan]
include = ["cardigan", "strickjacke", "knit jacket", "sweater jacket"]
exclude = ["weste", "pullunder", " vest"]
[collector.garment_rules.hoodie]
include = ["hoodie", "hoody", "hooded", "kapuze"]
exclude = ["weste", "gilet", "jacke", "zip"]
[collector.garment_rules.jacket]
exclude = ["mantel", "coat ", "parka", "trench", "weste", "gilet", " vest", "overshirt", "hemdjacke", "shacket",
           "shirt jac", "strickjacke", "cardigan", "knit jacket", "sweater jacket", "blazer", "sakko", "anzug", "kapuze",
           "hoodie"]
[collector.garment_rules.coat]
include = ["mantel", "coat ", "parka", "trench", "caban"]
page_decides = true
exclude = ["weste", "gilet"]
# Some shops name every link of a page for that page ("…-sakkos-4711"), so the link says "sakko" of all its
# products, and an overshirt listed among the blazers would pass for one: its name says what it is.
[collector.garment_rules.blazer]
include = ["blazer", "sakko", "anzugjacke", "suit jacket", "jackett"]
exclude = ["weste", "hose", "trousers", "pants", "smoking", "tuxedo", "samt", "velvet", "overshirt", "hemdjacke",
           "hemd-jacke", "shacket", "shirt jac", "shirt-jac"]
[collector.garment_rules.trousers]
exclude = ["chino", "jeans", "denim", "cargo", "jogg", "sweat", "shorts", "bermuda", "track", "leder", "pyjama",
           "schlaf", "bade", "5-pocket", "five pocket", "gürtel", "belt"]
[collector.garment_rules.chinos]
include = ["chino"]
page_decides = true
exclude = ["shorts", "bermuda", "cargo", "gürtel", "belt"]
[collector.garment_rules.jeans]
include = ["jeans", "denim"]
exclude = ["shorts", "jorts", "bermuda", "jacke", "jacket", "hemd", "shirt", "weste", "gürtel", "belt"]
[collector.garment_rules.cargo]
include = ["cargo"]
page_decides = true
exclude = ["shorts", "bermuda", "jorts", "gürtel", "belt"]
[collector.garment_rules.sneakers]
exclude = ["boot", "stiefel", "sandal", "slide", "pantolette", "badeschlappe", "clog", "socke", "sock", "pflege",
           "loafer", "derby", "mokassin", "oxford", "brogue", "budapester", "monk", "slipper", "halbschuh"]
[collector.garment_rules.shoes]
include = ["loafer", "derby", "mokassin", "oxford", "brogue", "budapester", "monk", "schnürschuh", "slipper",
           "halbschuh", "anzugschuh", "business"]
exclude = ["sneaker", "trainer", "turnschuh", "boot", "stiefel", "sandal", "hausschuh"]
[collector.garment_rules.boots]
include = ["boot", "stiefel", "chelsea"]
exclude = ["bootcut", "boot cut", "boot-cut", "sneaker"]


# ── COS ───────────────────────────────────────────────────────────────────────
# Category pages give name, price, colour, picture and link. COS answers
# "Access Denied" to automated browsers on product pages, so those are not
# visited: fabric is estimated from the product name and size stock is unknown
# until you add it by hand (slot page → "Add details").
[cos]
label         = "COS"
styles        = ["minimal", "smart-casual", "tailored"]   # our own reading of its range, not from the round 6 research (COS was not in its table)
price         = "mid-premium"
programme     = "rakuten"      # Germany is listed; it recruits "content creators", which may not cover a styling site (PLAN.md, medium confidence)
base          = "https://www.cos.com"
product_pages = false          # refused to automated browsers: the fabric pass never asks

[cos.garments.coat]
pages   = ["/de-de/men/coats-and-jackets/wool-coats", "/de-de/men/coats-and-jackets"]
include = ["mantel", "coat"]
exclude = ["weste", "gilet", "jacke", "leder", "wattiert", "stepp", "daunen", "puffer"]

[cos.garments.jacket]
pages   = ["/de-de/men/coats-and-jackets"]
include = ["jacke", "jacket", "blouson", "bomber"]
exclude = ["mantel", "coat", "weste", "gilet", "leder", "steppjacke", "wattiert", "daunen", "puffer", "hemdjacke", "overshirt", "strickjacke"]

[cos.garments.blazer]
pages   = ["/de-de/men/suits"]
include = ["blazer", "sakko"]
exclude = ["smoking", "samt", "tuxedo"]

[cos.garments.overshirt]
pages   = ["/de-de/men/shirts", "/de-de/men/coats-and-jackets"]
include = ["overshirt", "hemdjacke"]
exclude = ["leder"]

[cos.garments.cardigan]
pages   = ["/de-de/men/knitwear/cardigans"]
exclude = ["weste", "pullunder"]

[cos.garments.knit]
pages   = ["/de-de/men/knitwear/jumper"]
exclude = ["cardigan", "polo", "hoodie", "kapuze", "weste", "pullunder", "sweatshirt", "reißverschluss", "zip"]

[cos.garments.shirt]
pages   = ["/de-de/men/shirts"]
exclude = ["overshirt", "hemdjacke", "kurzarm", "short-sleeve", "polo", "t-shirt"]

[cos.garments.polo]
pages   = ["/de-de/men/polo-shirts"]

[cos.garments.tee]
pages   = ["/de-de/men/t-shirts"]
exclude = ["langarm", "long-sleeve", "tank", "ärmellos", "polo", "henley"]

[cos.garments.longsleeve]
pages   = ["/de-de/men/t-shirts"]
include = ["langarm", "long-sleeve"]
exclude = ["polo", "henley"]

[cos.garments.trousers]
pages   = ["/de-de/men/trousers"]
exclude = ["chino", "jeans", "jogg", "shorts", "cargo", "leder", "sweat"]

[cos.garments.chinos]
pages   = ["/de-de/men/trousers"]
include = ["chino"]

[cos.garments.jeans]
pages   = ["/de-de/men/jeans"]
exclude = ["shorts", "jacke", "hemd"]

# Hoodies and cargo trousers (added 19 Nov 2026, not collected yet). These addresses were not opened, so no
# request was made to the store for them: if one comes back "not found", copy the right one from the store's menu.
[cos.garments.hoodie]
pages   = ["/de-de/men/sweatshirts-and-hoodies"]
include = ["hoodie", "kapuze"]
exclude = ["weste", "gilet"]

[cos.garments.cargo]
pages   = ["/de-de/men/trousers"]
include = ["cargo"]
exclude = ["shorts"]

[cos.garments.sneakers]
pages   = ["/de-de/men/shoes"]
include = ["sneaker", "trainer"]

[cos.garments.shoes]
pages   = ["/de-de/men/shoes/loafers", "/de-de/men/shoes"]
include = ["loafer", "derby", "schnürschuh", "lace-up", "mokassin"]
exclude = ["sneaker", "boot", "stiefel", "sandal"]

[cos.garments.boots]
pages   = ["/de-de/men/shoes/boots"]


# ── Weekday ───────────────────────────────────────────────────────────────────
# Category pages give name, price, colour, picture, link and size stock.
# Product pages are refused to automated browsers (as at COS), so fabric is
# estimated from the name. Weekday sells no men's shoes.
[weekday]
label         = "Weekday"
styles        = ["street", "minimal"]   # our own reading too: denim and young casual
price         = "budget-mid"
# Rakuten, but UNCONFIRMED for Germany: Rakuten lists Weekday for Great Britain only, and its
# Nordic programme (Adtraction) does not cover Germany. Kept on offer until the application
# says otherwise; set "none" if Weekday has no programme open to a German site.
programme     = "rakuten"
base          = "https://www.weekday.com"
product_pages = false          # refused to automated browsers, as at COS

[weekday.garments.coat]
pages   = ["/de-de/men/jackets-and-coats/"]
include = ["mantel", "coat"]
exclude = ["leder", "wattiert", "stepp", "daunen", "puffer"]

[weekday.garments.jacket]
pages   = ["/de-de/men/jackets-and-coats/"]
exclude = ["mantel", "coat", "weste", "vest", "blazer", "puffer", "daunen", "stepp", "leder", "fleece"]

[weekday.garments.blazer]
pages   = ["/de-de/men/jackets-and-coats/"]
include = ["blazer", "sakko"]

[weekday.garments.overshirt]
pages   = ["/de-de/men/shirts/"]
include = ["overshirt", "hemdjacke"]
exclude = ["leder"]

[weekday.garments.cardigan]
pages   = ["/de-de/men/knitwear/cardigans/"]

[weekday.garments.knit]
pages   = ["/de-de/men/knitwear/sweaters/"]
exclude = ["cardigan", "strickjacke", "hoodie", "kapuze", "weste", "zip", "reißverschluss", "polo"]

[weekday.garments.shirt]
pages   = ["/de-de/men/shirts/"]
exclude = ["overshirt", "hemdjacke", "kurzarm", "short-sleeve", "kurzärm"]

[weekday.garments.polo]
pages   = ["/de-de/men/t-shirts-and-tops/"]
include = ["polo"]

[weekday.garments.tee]
pages   = ["/de-de/men/t-shirts-and-tops/"]
include = ["t-shirt"]
exclude = ["langarm", "long-sleeve", "longsleeve", "tank", "polo", "ärmellos"]

[weekday.garments.longsleeve]
pages   = ["/de-de/men/t-shirts-and-tops/"]
include = ["langarm", "long-sleeve", "longsleeve"]
exclude = ["polo"]

[weekday.garments.trousers]
pages   = ["/de-de/men/trousers/"]
exclude = ["jogg", "sweat", "cargo", "chino", "shorts", "track", "jeans", "leder", "5-pocket", "denim", "bootcut"]

[weekday.garments.chinos]
pages   = ["/de-de/men/trousers/"]
include = ["chino"]

[weekday.garments.jeans]
pages   = ["/de-de/men/jeans/"]
exclude = ["shorts", "jacke", "jorts"]

# Hoodies and cargo trousers (added 19 Nov 2026, not collected yet; the addresses were not opened, as at COS).
[weekday.garments.hoodie]
pages   = ["/de-de/men/hoodies-and-sweatshirts/"]
include = ["hoodie", "kapuze"]
exclude = ["weste", "vest"]

[weekday.garments.cargo]
pages   = ["/de-de/men/trousers/"]
include = ["cargo"]
exclude = ["shorts", "jorts"]


