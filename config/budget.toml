# ══════════════════════════════════════════════════════════════════════════════
#  How big the plan is: the budget decides (wardrobe/capsule.py)
#
#  Edit a number, save, and the next plan made from a profile follows it: a new
#  account, "Start over from my profile", or a Profile save that rebuilds the
#  plan. A plan that exists is never changed by an edit here.
#
#  How the plan is sized, step by step:
#   1. Money for pieces: the whole budget up to `whole_budget_up_to`, plus
#      `share_of_the_rest` of what is above it. The rest of the budget buys
#      better versions of the same pieces ("Best for budget").
#        150 € -> 150 €   300 € -> 250 €   600 € -> 400 €   1,000 € -> 600 €
#   2. Each piece counts at its usual price, below.
#   3. Each kind of wardrobe joins when its first three pieces (a top, trousers
#      and shoes) fit in that money; a piece already in the plan counts nothing.
#      "Both" is everyday first, then office.
#   4. The pieces of the kinds that joined stand in one line: first all their
#      first three, then each kind's 4th piece, then each kind's 5th, and so on.
#      A piece already in the line (same garment, same colour) is skipped. The
#      plan is the line from the top for as long as the money lasts, with at
#      most `most_pieces` pieces. A white tee ×2 counts as two pieces.
#  The pieces of each kind, in order, are in wardrobe/capsule.py (RANKED).
# ══════════════════════════════════════════════════════════════════════════════

[money]
whole_budget_up_to = 200    # €: all of the budget up to this buys pieces
share_of_the_rest  = 0.5    # and this share of what is above it (0.5 = half)
most_pieces        = 24     # never more pieces than this in a plan

[names]
# Under this budget a piece's name leaves out what it is made of: "Grey jumper",
# not "Grey merino jumper", as the jumper a small budget buys is rarely merino.
# A piece's id keeps the full name at every budget ("grey-merino-jumper").
full_names_from = 450       # €
left_out_below  = ["merino", "wool", "leather"]

# The usual price of each garment at a budget store, in €: about the cheapest
# one that is rated 70 or more (config/scoring.toml). Only the tee's was read on
# shops' pages; every other price is an estimate.
[usual_price]
tee        = 9      # read on 18 Nov 2026: C&A's regular tee at 7.99 € (c-and-a.com), Pull&Bear's basic tee at 10.99 € (zalando.de)
longsleeve = 13     # estimate
polo       = 20     # estimate
shirt      = 25     # estimate
knit       = 25     # estimate
cardigan   = 35     # estimate
overshirt  = 35     # estimate
jacket     = 50     # estimate
coat       = 120    # estimate
blazer     = 70     # estimate
trousers   = 35     # estimate, for cotton ones: trousers of polyester and viscose never rate 70 here
chinos     = 25     # estimate
jeans      = 25     # estimate
sneakers   = 40     # estimate
shoes      = 60     # estimate (leather derby shoes)
boots      = 70     # estimate
