# ══════════════════════════════════════════════════════════════════════════════
#  The stores whose product feeds Capsule may use, and how to fetch each feed
#
#  A store's product feed is licensed by its affiliate programme to approved
#  partners only. List a store here when you apply, and change its status as
#  the answers come. Then copy this file into the database:
#
#      python -m wardrobe stores sync        add and update the stores (never deletes products)
#      python -m wardrobe stores             list them, with products, dates, stale or failed
#      python -m wardrobe feeds              fetch every approved store's feed when it changed
#      python -m wardrobe stores end KEY     a programme ended: delete all its products at once
#
#  Every store found with a partner programme for Germany (research of 13 Nov 2026)
#  is listed below, grouped by network in the order to apply: Awin first, then
#  Rakuten (COS), then Tradedoubler, then the others. None has been applied to yet.
#  The owner's page /stores shows them the same way, with each programme's page as
#  a link: it doubles as the checklist for applying. Capsule never opens those pages.
#  Stores with no programme (Zara, the main Zalando shop, Uniqlo, Hugo Boss, Marc
#  O'Polo, ASOS, Scotch & Soda, Manufactum) are not listed.
#
#  This file is not the collector's: config/stores.toml is (the store pages read
#  on your own machine). Nothing from the collector ever goes into these tables.
#
#  Secrets never go in this file. A feed address or header names them in braces,
#  and they are read from environment variables of that name when the feed is
#  fetched, e.g.  {AWIN_API_TOKEN}.  {programme_id} is the store's own id below.
#
#  status        none (not applied yet) | applied | approved | refused | ended   (only "approved" is fetched)
#  network       awin | rakuten | tradedoubler | partnerize | daisycon | webgains | impact
#  programme_id  the store's id in its network, e.g. its Awin advertiser id
#  programme_page  the programme's page (or where the research found it), a link for you on /stores
#  unconfirmed   what the research could not confirm, e.g. "Germany"; leave it out once it is
#  notes         what the research says: commission, what the programme requires
#  links_only    true: the programme forbids storing its site, so nothing of it is ever imported
#                (no feed_location or feed_format then)
#  feed_format   google             Google Shopping format: JSON Lines (Awin's product API),
#                                   or CSV or TSV (Webgains and others)
#                awin_csv           Awin's standard CSV
#                tradedoubler_json  Tradedoubler's Products API, JSON
#                (Rakuten's pipe-delimited files come in a later round.)
#  feed_location an https address, or a file on this computer (dated by the file's own
#                time, so put each feed there as it arrives)
#  delivery_note shown next to prices later, e.g. "Versand 4,95 €, ab 50 € frei"
#  disclaimer    text the programme requires next to its name
#  [rules]       refresh_hours   how often the feed is expected to change (default 24); a feed
#                                older than this plus a day is flagged stale
#                delete_on_exit  the programme wants its data deleted when it ends
#                images          what the programme allows with its photos
#                answers         what the programme said in writing (e.g. about AI pictures)
#                check_url       where to ask when the feed last changed, before downloading it.
#                                Give it for every Tradedoubler store (its productsUnlimited/
#                                lastUpdated address): without it, its feed is downloaded at most
#                                every 8 hours, as Tradedoubler allows 3 downloads of one version a day
#                headers         request headers, e.g. { Authorization = "Bearer {SOME_TOKEN}" }
#                max_mb          the largest feed accepted (default 300)
# ══════════════════════════════════════════════════════════════════════════════


