# ── A store, once its programme approves Capsule ────────────────────────────
# For a store listed above: set its status, and add the feed lines below to it.
# For another store: copy the lines below, remove the first # of each one, and fill them in.
#
# [stores.yourstore]
# label         = "Your Store"
# network       = "awin"
# programme_id  = "12345"                      # the store's advertiser id in Awin
# status        = "applied"
# feed_format   = "google"
# # the address Awin's product API documentation gives; check the language part (de_DE) there
# feed_location = "https://api.awin.com/publishers/{AWIN_PUBLISHER_ID}/awinfeeds/download/{programme_id}-retail-de_DE.jsonl"
# delivery_note = "Versand 4,95 €, ab 50 € frei"
# disclaimer    = ""
# [stores.yourstore.rules]
# refresh_hours  = 24
# delete_on_exit = true
# headers        = { Authorization = "Bearer {AWIN_API_TOKEN}" }   # or in the address: as Awin's API documentation asks
# answers        = "What the programme said in writing"
