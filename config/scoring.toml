[fabric.adjustments]
# "Mostly synthetic" penalty: applied when these fibres together make up more
# than the given share of the fabric.
synthetic_fibres         = ["polyester", "acrylic", "polyamide", "polyurethane", "elastane"]
mostly_synthetic_above   = 50      # percent
mostly_synthetic_penalty = 15      # points taken off the fabric score
mostly_synthetic_exempt  = ["jacket"]   # garment types where synthetics are normal

# Wool-rich bonus, for the garments where wool is the point.
wool_fibres          = ["wool", "merino", "cashmere", "alpaca", "mohair"]
wool_rich_from       = 50          # percent
wool_rich_bonus      = 5           # points added to the fabric score
wool_rich_categories = ["knit", "cardigan", "coat", "blazer", "trousers", "overshirt"]

unknown_composition = 45           # fabric score when nothing at all is known about the fabric

# When a store's product page can't be read (COS and Weekday refuse automated
# browsers there), the composition is estimated from the product name until you
# type the real one in ("Add details" on the slot page). These are the shares
# assumed for the fibre the name mentions; the rest counts as "other".
[fabric.name_guess]
enabled     = true
pure_share  = 100      # "100 % Wolle", "aus reinem Kaschmir", "pure"
plain_share = 85       # "Pullover aus Merinowolle": named, no amount given
blend_share = 50       # "Wollmix", "Wollmischung", "blend"
trace_share = 25       # "mit Wollanteil"
penalty     = 5        # points off the fabric score, because it is a guess

# Last resort when the name says nothing either: what the garment type is
# normally made of. Leave a type out to score it as unknown instead.
[fabric.assume_when_unknown]
jeans  = "99 % Baumwolle, 1 % Elasthan"
chinos = "97 % Baumwolle, 3 % Elasthan"


