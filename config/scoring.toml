# ══════════════════════════════════════════════════════════════════════════════
#  Quality score rules
#
#  Edit anything here, save, and reload the page — no restart needed.
#
#  Every candidate gets three sub-scores from 0 to 100:
#    fabric  what it is made of, judged per garment type
#    brand   how good this store is at this kind of garment
#    price   whether the price is plausible for this kind of garment
#  The final score is their weighted average. The app shows the working for
#  every item under "How it's rated".
#
#  Garment types: coat, jacket, blazer, overshirt, cardigan, knit, shirt, polo,
#  tee, longsleeve, trousers, chinos, jeans, sneakers, shoes, boots
# ══════════════════════════════════════════════════════════════════════════════

[weights]            # relative importance; they are rescaled to add up to 100 %
fabric = 0.50
brand  = 0.30
price  = 0.20


# ── Fabric ────────────────────────────────────────────────────────────────────
# Base value of each fibre: 0 = avoid, 100 = best. The fabric score is the
# percentage-weighted average of the fibres in the composition, so
# "80 % wool, 20 % polyamide" = 0.8 × wool + 0.2 × polyamide.

[fabric.fibres]
cashmere       = 100
merino         = 95
wool           = 90
alpaca         = 90
mohair         = 85
silk           = 88
linen          = 82
organic_cotton = 80
cotton         = 76
hemp           = 78
leather        = 90
suede          = 85
lyocell        = 68
cupro          = 66
modal          = 60
viscose        = 50
elastane       = 50
polyamide      = 40
polyester      = 25
polyurethane   = 20
acrylic        = 12
rubber         = 50
other          = 45    # any fibre not listed above

# Per-garment overrides: the same fibre matters differently in a jumper than in
# a rain jacket. Anything not listed for a garment falls back to the base value.

