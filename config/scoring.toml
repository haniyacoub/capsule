# ── Price sanity ──────────────────────────────────────────────────────────────
# Per garment type, in EUR:
#   suspicious_below  cheaper than this usually means corners were cut
#   fair              full marks anywhere inside this band
#   steep_above       beyond this you are paying for something other than quality
# The score slides in a straight line between those points.

[price]
score_when_suspicious = 40   # score at or below suspicious_below
score_when_steep      = 55   # score at or above steep_above

[price.bands.tee]
suspicious_below = 8
fair             = [12, 40]
steep_above      = 60

[price.bands.longsleeve]
