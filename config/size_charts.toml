# ══════════════════════════════════════════════════════════════════════════════
#  Size charts per store
#
#  APPROXIMATE. COS and Zara ask automated visitors (robots.txt) not to open
#  their size-guide pages, so these figures were not collected: they are the
#  brands' usual published body measurements as best known, rounded. Before you
#  rely on a flag, open the size guide on the product page and correct the
#  numbers here — the app re-reads this file on the next page load.
#
#  Two kinds of table per store:
#
#  1. Labels   [cos.tops] / [cos.bottoms]
#     Translate a label the store prints into YOUR size from the Profile page.
#       tops     label -> your top size(s)
#       bottoms  label -> your jeans waist(s) in inches
#     Labels that need no translation are understood without an entry: "M" for
#     tops, "32/32" or "W32 L32" for trousers, EU shoe sizes.
#
#  2. Body measurements   [cos.body.tops] / [cos.body.bottoms]
#     The body the store says each size fits, in cm, as [from, to].
#       body.tops     size  -> chest
#       body.bottoms  label -> waist
#     Used only if you enter your chest / waist on the Profile page.
# ══════════════════════════════════════════════════════════════════════════════

[check]
near_edge_cm   = 1.5    # this close to the border between two sizes counts as "between sizes"
tall_from_cm   = 190    # from this height, flag garments that come in one length
short_up_to_cm = 170    # up to this height, likewise
slim_build_bmi = 21.5   # at or below: oversized cuts will look bigger still
broad_build_bmi = 26.0  # at or above: slim cuts may be tight

