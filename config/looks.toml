# ══════════════════════════════════════════════════════════════════════════════
#  AI pictures of outfits ("looks")
#
#  On the Outfits page an image service draws each outfit on a model: first one
#  front picture on a white studio background, from a written description of
#  the pieces; then, when a customer taps "More photos", five more pictures made
#  FROM that front picture (two more poses, three surroundings: see [poses] and
#  [scenes]). It is off until the key of the service named under [service] is
#  set, Google's as this file comes:
#
#      export GEMINI_API_KEY="…"         (from aistudio.google.com)
#
#  and the app is started again. `python -m wardrobe looks` says whether it is
#  on; `python -m wardrobe looks --test` draws one sample picture.
#
#  For Google, use a key from a Google Cloud project with billing switched on:
#  Google's image models have no free tier, and its terms forbid free keys for
#  a service used by people in the EU.
#
#  Every picture is billed to that key by the service (a few cents each), so
#  the limits below matter. Edits here apply on the next page load.
# ══════════════════════════════════════════════════════════════════════════════

# Which company draws the pictures: "google" (GEMINI_API_KEY) or "openai"
# (OPENAI_API_KEY). Only the one named here is ever used, whatever other key is
# set. With a customer's photo, that photo goes to it with every picture of him,
# so the privacy policy and a data-processing agreement must name the same
# company: today that is Google. Choose "openai" only once both say OpenAI.
# ("auto", whichever key happens to be set, OpenAI first, is still understood,
# but never use it: setting an OpenAI key for something else would then send
# customers' photos to OpenAI without a word.)
[service]
use = "google"

[service.openai]
# The services rename and retire models every few months. If pictures stop with
# "does not know the model", put the current name here (their docs list them).
model   = "gpt-image-2.5-flare"   # the fast one; "gpt-image-2.5-sunburst" is their most capable
quality = "medium"                # low | medium | high — higher looks better, takes longer, costs more

[service.google]
model      = "gemini-nano-banana-2.1"
image_size = "1K"                 # 1K | 2K | 4K — larger costs more


[pictures]
auto   = true      # draw an outfit's picture as soon as it is looked at (false: only when "See it worn" is pressed)
photos = true      # people may upload a photo of themselves to be the model
# "More photos" (five more pictures) and "See it move" (a video) are offered only on
# the outfits a customer has added to his wardrobe, where he has said yes: the money
# follows what he wants, not every outfit he scrolls past. The front picture is still
# drawn for every outfit looked at. Owners and Pro accounts (python -m wardrobe owner
# add / pro add), and your own machine, may make them of any outfit.
# false: offered on every outfit, as before.
more_only_on_yes = true

# How many pictures may be started in 24 hours. Each one costs money (about 4 to
# 5 cents), whichever of an outfit's six pictures it is. "More photos" draws
# five, so 30 is five whole sets a day for a customer, or 30 front pictures.
per_day              = 300   # everyone together (on your own machine: you)
per_customer_per_day = 30    # each customer of a public service

# What one picture costs, in US dollars. Only for the estimate that
# `python -m wardrobe example-pictures` (the example wardrobe's pictures) prints
# before it draws anything: nothing else reads it, and nothing is charged by it.
# From Google's price list, read on 15 Nov 2026: the model under [service.google]
# at 1K is $0.0336 a picture, and the words sent and the model's "thinking" are
# billed on top, so about 4 to 5 cents all in. Rounded up to 5 cents, so the
# estimate errs on the high side. OpenAI's prices differ. Your bill has the real
# figure: put it here once you have seen it.
price_each_usd = 0.05


# What the image service is told. The list of pieces is added by the app.
# These words were written from Google's guidance on 15 Nov 2026 and have not
# yet been tried against the paid service. New words mean new pictures.
[text]
# The model, for anyone who has not put their own together on the Profile page.
model = "an adult male fashion model with an average build"

# The front picture (picture 1): the only one drawn from words alone, and the
# one the dots sit on. {model} is replaced by the description of the model.
scene = "A full-length studio photograph for a menswear lookbook: {model}. He stands upright in a relaxed, natural pose, facing the camera, arms loosely at the sides, weight slightly on one leg. The whole figure is in frame from head to shoes, centred, with a little space above the head and below the shoes. Seamless pure white studio background and white floor, soft even light from the front left, a faint natural shadow under the shoes. Shot on a full-frame camera with an 85 mm lens at eye level. Realistic fabric textures and true colours."

# Used instead when someone uploaded their own photo. {body} is replaced by the
# height and build they chose, if any.
scene_with_photo = "A full-length studio photograph for a menswear lookbook. The model is the person in the attached photo: keep their face, hair, skin tone and apparent age exactly as they are, and ignore the clothes and the background of the photo. {body}They stand upright in a relaxed, natural pose, facing the camera, arms loosely at the sides, weight slightly on one leg. The whole figure is in frame from head to shoes, centred, with a little space above the head and below the shoes. Seamless pure white studio background and white floor, soft even light from the front left, a faint natural shadow under the shoes. Shot on a full-frame camera with an 85 mm lens at eye level. Realistic fabric textures and true colours."

# Pictures 2 to 6 are made from the front picture: it is sent to the image
# service as a picture, with these words, so the man and the clothes are copied
# and not described anew. {change} is replaced by the words of one pose or one
# scene below. The list of pieces follows, as with the front picture.
from_anchor = "The attached photograph shows a man in an outfit. Make a new photograph of the same man in the same outfit. Keep exactly: his face, hair, skin tone, age, height and body shape; every piece of clothing with its colour, fabric, pattern, cut, length and fit; how the layers are worn (open or closed, tucked or not); the shoes. Change only this: {change} The whole figure is in frame from head to shoes. Realistic fabric textures and true colours. For reference, the outfit is, from the outer layer down to the shoes:"

# What must not appear: in the studio pictures …
avoid = "No bag, hat, scarf, gloves, glasses or jewellery unless listed above. No text, logos, labels or watermarks anywhere in the picture. One person only, no props."

# … and in the surroundings, where one thing in the hand is allowed (the cup, the book).
avoid_scene = "No bag, hat, scarf, gloves, glasses or jewellery unless listed above. No text, logos, labels or readable signs anywhere. No other people in focus."


# The pictures after the front one, in the order of the small pictures under
# an outfit: first the poses (white studio), then the scenes (surroundings).
# Each is one picture: billed like any picture, counted in the limits under
# [pictures], and kept, so looking at it again costs nothing. `label` is its
# name on the page (one short word); `change` is what the image service is told
# to change in the front picture. Each surrounding has its own natural pose: a
# man standing to attention in a café is what looks pasted in. Another pose or
# place is one more block here (six at most of each).
[poses.walking]
label  = "Walking"
change = "He walks towards the camera, caught in the middle of a step, one foot forward, arms swinging naturally, looking just past the camera. Same seamless white studio background and white floor, same soft even light, a faint shadow under his feet."

[poses.turned]
label  = "Turned"
change = "He stands turned about 45 degrees to his left, one hand in his trouser pocket, the other arm relaxed, looking past the camera. Same seamless white studio background and white floor, same soft even light, a faint shadow under his feet."

[scenes.street]
label  = "Street"
change = "He is photographed on location, walking along the wide pavement of a quiet European city street with pale stone buildings, a few parked bicycles and a tree further back. He is caught mid-step, looking ahead, slightly off-centre in the frame. Natural overcast daylight from above; the same light falls on him and on the street, and he casts a soft shadow on the pavement at his feet. Shot at eye level on a 50 mm lens at f/2.8: he is sharp, the street behind him is gently less sharp but still clearly a real place, with depth from near to far. A candid editorial fashion photograph, with the natural colours of an unedited photo."

[scenes.cafe]
label  = "Café"
change = "He is photographed on location inside a small, calm café, standing beside a wooden counter near a large window, one hand resting on the counter and holding a plain white coffee cup, looking towards the window. Daylight from the window lights one side of him and the counter alike, with soft shadows on the other side; warm reflections from the wood. Part of a table and chair is in the foreground at the edge of the frame. Shot at eye level on a 35 mm lens at f/2.8, so the room around him is visible and real. A candid editorial fashion photograph, with the natural colours of an unedited photo."

[scenes.library]
label  = "Library"
change = "He is photographed on location in a quiet library, standing at a tall wooden bookshelf, holding an open book in one hand and looking down at it, turned slightly away from the camera. Warm light from tall windows on one side falls across him and the shelves alike; his shadow falls on the floor and the shelf beside him. Rows of shelves lead away behind him. Shot at eye level on a 50 mm lens at f/2.8. A candid editorial fashion photograph, with the natural colours of an unedited photo."


# Where the dot for each piece sits on the front picture: [from the left %, from
# the top %]. Every front picture uses the same pose and framing, so fixed
# places work; nudge them here if the dots sit beside the garments. The other
# five pictures have no dots: the man stands differently in each.
[hotspots]
outer  = [66, 50]   # coat or jacket, worn open: its right-hand panel
mid    = [45, 40]   # blazer, cardigan or overshirt, worn open: its left-hand panel, inside the coat's lapel
top    = [50, 30]   # chest
collar = [50, 22]   # a shirt under a jumper shows only here
bottom = [45, 66]   # thigh
shoes  = [58, 92]   # the middle of one shoe


# "See it move": a short AI video of an outfit (videos.py). Under whichever of
# an outfit's pictures is showing (the front one, a pose or a surrounding), "See
# it move" asks Google's video model for an upright (9:16), 720p clip that
# starts from exactly that stored picture, with a movement that fits it: the
# front picture turns once on the spot and then poses (8 seconds; the customer
# can drag across it to turn the model), each other picture moves naturally for
# a few seconds (`seconds` below). It plays muted. It needs GEMINI_API_KEY, also
# where OpenAI draws the pictures.
#
# By Google's price list of 15 Nov 2026 (about $0.07 a second at 720p for
# gemini-omni-1.2-flash) the turn costs about $0.56 and a 5-second clip about
# $0.35; under the older price the turn was up to $0.81. A clip takes 40
# seconds to two minutes. Each picture has one clip: it is kept and shown again
# for free, to everybody who sees that picture (a picture drawn from a
# customer's photo, and its video, only to that customer).
[videos]
on    = true       # false: no "See it move" anywhere

# The model's name. "gemini-omni-flash-preview" is the name that worked on 13 Nov
# 2026, when gemini-omni-1.2-flash and -1.1-flash answered "not found". Google's
# documentation and price list of 15 Nov name gemini-omni-1.2-flash as the
# current model, at the lower price above. To try it without touching this file
# (one clip billed; the sample pictures come from `looks --test-set`):
#     python -m wardrobe looks --test-video --video-model gemini-omni-1.2-flash
# If that makes a clip, put the name here.
model = "gemini-omni-flash-preview"

# Tells Google that the picture is the clip's first frame (its documentation of
# 15 Nov 2026; not yet tried against the paid service). If Google answers that
# it does not accept the request, set this to "" and it is left out.
task = "image_to_video"

# How long a clip of a pose or a surrounding is, in seconds (3 to 15; each
# second is billed). The front picture's turn is always 8.
seconds = 5

# What one second of video costs, in US dollars. Only for the estimate that
# `python -m wardrobe example-pictures --clips K` (the example wardrobe's clips)
# prints before it makes anything: nothing else reads it, and nothing is charged
# by it. Google's price list of 15 Nov 2026 says about $0.07 a second at 720p for
# gemini-omni-1.2-flash; under the older price it was about $0.10 a second (the
# turn, 8 seconds, up to $0.81). Set at the older, higher price, so the estimate
# errs on the high side, as for pictures: a 5-second clip about $0.50.
# Your bill has the real figure: put it here once you have seen it.
price_per_second_usd = 0.10

# How many videos may be asked for in 24 hours. These are apart from the
# pictures' limits: a video never uses up a picture, nor a picture a video.
per_customer_per_day     = 1    # each customer of a public service
pro_per_customer_per_day = 5    # each Pro account (python -m wardrobe pro add EMAIL) and each owner
per_day                  = 10   # everyone together (on your own machine, where there is no limit per person: you)

# Dragging across the front picture's video turns the model: from left to
# right, these first seconds of the clip, where he turns once round. Nudge it if
# a drag across the whole picture turns him a little more or less than once.
turn_seconds = 6.2

# What the video model is told, with the picture: `start`, then the movement of
# that picture, then `keep`. These words were written from Google's guidance on
# 15 Nov 2026 and have not yet been tried against the paid service. New words
# mean new videos. Google always makes a sound track: `keep` asks for quiet, and
# the page plays every clip muted.
start = "Animate this exact photograph, starting from it as the first frame."
keep  = "Keep the man, every piece of clothing with its colour, fabric and fit, the place and the light exactly as in the photograph. No other people, no text, no logos. No dialogue, no music: only quiet room sound."

# The movement for each picture, by its name: `front`, and the names under
# [poses] and [scenes] above. A pose or a place added there without a line here
# gets `other`; a line here for a pose that is gone does no harm.
[videos.motion]
front   = "The man turns slowly on the spot through one full circle at an even pace, so that the front, one side, the back and the other side of the outfit are each seen clearly, then faces the camera again and settles into a relaxed pose for the last seconds. The camera stays still and does not zoom; the whole figure stays in frame from head to shoes."
walking = "The man walks three unhurried steps towards the camera and comes to a stop, relaxed. The camera stays still; the whole figure stays in frame."
turned  = "The man turns to face the camera, straightens his cuff with the other hand, and stands relaxed. The camera stays still; the whole figure stays in frame."
street  = "The man walks on along the pavement at an easy pace while the camera moves backwards with him at the same speed, keeping him at the same size in the frame. Leaves and distant traffic move a little."
cafe    = "The man lifts the cup, takes a small sip, lowers it and looks out of the window. The camera stays still. Steam rises faintly from the cup."
library = "The man turns a page of the book, then looks up towards the camera with a slight smile. The camera stays still."
other   = "The man moves naturally for a few seconds, as in a candid moment: he shifts his weight, moves one arm a little and looks to one side, then back. The camera stays still; the whole figure stays in frame."

# The example wardrobe's clips (python -m wardrobe example-pictures --clips K):
# 5 seconds made from an outfit's front picture, which visitors without an
# account see in place of the picture, muted and looping. A slight turn and back
# shows the clothes best there: the cut and the drape from the side, while the
# feet stay put, so the dots on the pieces stay on them; it ends as it starts, so
# the loop does not jump; and the AI is never asked to invent the back of the
# clothes, as a whole turn would. New words mean new clips (each billed).
example = "The man shifts his weight and turns slowly about 30 degrees to his left, so that the cut and the drape of the outfit show from the side, holds for a moment, then turns back and ends facing the camera exactly as at the start, in the same relaxed pose. His feet stay where they are. The camera stays still and does not zoom; the whole figure stays in frame from head to shoes."
