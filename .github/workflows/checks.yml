# Runs on every push and pull request, and once a week (new vulnerabilities in the packages
# appear without anyone pushing): the same checks as ./check.sh, plus the browser
# walk-through, and building the container and starting it.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"      # Mondays, early morning

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]     # the container's version, and the one the app is developed on
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ./check.sh

  browser:
    name: Browser walk-through
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py

  audit:
    name: Known vulnerabilities in the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements-prod.txt

  container:
    name: Container builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Settings for a throwaway run
        run: |
          cp deploy/app.env.example deploy/app.env
          cp deploy/tunnel.env.example deploy/tunnel.env     # compose wants the file to exist; the tunnel is not started
          key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$key|; s|^SITE_URL=.*|SITE_URL=http://127.0.0.1:8000|" deploy/app.env
      - name: Build the image and start the app (without the tunnel)
        run: docker compose -f deploy/compose.yaml up -d --build app
      - name: Wait until it reports healthy
        run: |
          id="$(docker compose -f deploy/compose.yaml ps -q app)"
          for i in $(seq 1 40); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$id")"
            echo "health: $state"
            [ "$state" = "healthy" ] && exit 0
            sleep 2
          done
          exit 1
      - name: Ask for its pages from inside the container
        run: |
          docker compose -f deploy/compose.yaml exec -T app python -c "
          import urllib.request
          for path in ('/healthz', '/', '/login', '/signup', '/static/app.css', '/legal/privacy'):
              with urllib.request.urlopen('http://127.0.0.1:8000' + path, timeout=5) as answer:
                  print(answer.status, path)
          "
      - name: gunicorn read gunicorn.conf.py (it stops if workers keep dying, and opens no control socket)
        run: |
          docker compose -f deploy/compose.yaml logs app > app.log
          grep "Guard on" app.log
          if grep -i "control socket" app.log; then echo "gunicorn opened its control socket"; exit 1; fi
      - name: What the app logged
        if: always()
        run: docker compose -f deploy/compose.yaml logs app
